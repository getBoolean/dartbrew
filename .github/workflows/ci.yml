name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare named Compose toolchain
        run: |
          python3 -c 'import json; print("CTR_IMAGE=" + json.load(open("toolchain/versions.json"))["container"]["image"])' >> "$GITHUB_ENV"
          echo "CTR_STATE_DIR=$RUNNER_TEMP/ctr-compose" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ctr-compose/cache" "$RUNNER_TEMP/ctr-compose/tmp"
      - name: Start toolchain with host-folder state
        run: |
          docker compose config
          docker compose up -d toolchain
      - name: Test source locking and build configuration
        run: docker compose exec -T toolchain python3 -m unittest discover -s toolchain/test -v
      - name: Stop toolchain
        if: always()
        run: docker compose down
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the launcher on the host
        run: make -C runtime/ctr host-test
  dart:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [dartbrew, release_tools]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the shipped host Dart SDK version
        working-directory: .
        run: python3 -c 'import json; print("DART_VERSION=" + json.load(open("release/preview.json"))["host_sdk"])' >> "$GITHUB_ENV"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: dart pub get --enforce-lockfile
      - run: dart analyze
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart test
